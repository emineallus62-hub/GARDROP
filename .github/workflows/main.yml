name: Build RC Gardrop Dedektoru

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name 'RCGardropDedektoru*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP bulunamadi."
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP"

          rm -rf android-project
          mkdir android-project

          unzip -q "$ZIP" -d android-project

          SETTINGS=$(find android-project -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle bulunamadi."
            find android-project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android proje klasoru: $PROJECT_DIR"

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"
          MAIN_JAVA="$PROJECT_DIR/app/src/main/java/com/beren/rcwardrobe/MainActivity.java"

          echo "Teknik uyumluluk duzeltmeleri uygulanıyor..."

          python3 - <<PY
          from pathlib import Path

          gradle = Path("$APP_GRADLE")
          text = gradle.read_text()

          if "buildFeatures" not in text:
              text = text.replace(
                  "android {\n",
                  "android {\n    buildFeatures {\n        aidl = true\n    }\n",
                  1
              )

          if "androidx.annotation:annotation" not in text:
              text = text.replace(
                  "dependencies {\n",
                  "dependencies {\n    implementation 'androidx.annotation:annotation:1.8.2'\n",
                  1
              )

          gradle.write_text(text)

          main = Path("$MAIN_JAVA")
          text = main.read_text()

          text = text.replace(
              "Shizuku.UserServiceConnection",
              "android.content.ServiceConnection"
          )

          main.write_text(text)
          PY

          echo "AIDL etkinlestirildi."
          echo "Shizuku ServiceConnection duzeltildi."
          echo "AndroidX annotation eklendi."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Check APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK bulunamadi."
            exit 1
          fi

          echo "APK hazir: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RC-Gardrop-Dedektoru-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
